<html>
  <head>
    <title>My First Page</title>
    <style>
      .one {
        height: 400px;
        width: 500px;
        background-color: lightseagreen;
        visibility: hidden;
      }

      .two {
        height: 400px;
        width: 500px;
        background-color: lightcoral;
      }
    </style>
  </head>
  <body>
    <div class="one"></div>
    <div class="two"></div>
  </body>
</html>
<!--
difference between visibility and display:none
display:none - removes that container completely
visibility:hidden - kepps the same of that container as it is and removes the container
-->
