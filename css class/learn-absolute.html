<!--
absolute is a type of position
it should have a parent element(div)
when we have parent element we should have its position as relative
then for the child element we need to give position as absolute only so that it moves inside the parent element
-->
<html>
  <head>
    <title>learn absolute</title>
    <style>
      .section {
        width: 800px;
        height: 400px;
        position: relative;
        border: 2px solid black;
        background-color: blueviolet;
      }
      .sub-section {
        width: 300px;
        height: 100px;
        position: absolute;
        top: 80px;
        right: 100px;
        background-color: brown;
        border: 2px solid black;
      }
    </style>
  </head>
  <body>
    <div class="section">
      <div class="sub-section"></div>
    </div>
  </body>
</html>
