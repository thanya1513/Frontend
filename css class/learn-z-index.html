<html>
  <head>
    <title>Learn Z Index</title>
    <style>
      .one {
        width: 200px;
        height: 100px;
        top: 50px;
        position: relative;
        z-index: 1; /* z-index is used to bring the position of the html element to the particular position */

        background-color: orchid;
        border: 2px solid black;
      }
      .two {
        width: 200px;
        height: 100px;
        position: relative;
        z-index: 2;

        border: 2px solid black;
        background-color: orange;
      }
    </style>
  </head>
  <body>
    <div class="one"></div>
    <div class="two"></div>
  </body>
</html>
