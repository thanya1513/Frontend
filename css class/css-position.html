<html>
  <head>
    <title>Learn CSS Position</title>
    <style>
      .one {
        background-color: brown;
        width: 800px;
        height: 150px;
        font-size: 60px;
        text-align: center;
        position: static;
        top: 200px;
        left: 200px;
      }
      .two {
        background-color: grey;
        width: 800px;
        height: 150px;
        font-size: 60px;
        text-align: center;
      }
      .three {
        background-color: pink;
        width: 800px;
        height: 150px;
        font-size: 60px;
        text-align: center;
        /* position: fixed;
        left: 200px; */
        position: sticky;
        top: 10px;
      }
      .four {
        background-color: olive;
        width: 800px;
        height: 150px;
        font-size: 60px;
        text-align: center;
      }
      .five {
        background-color: palevioletred;
        width: 800px;
        height: 150px;
        font-size: 60px;
        text-align: center;
      }
      .six {
        background-color: green;
        width: 800px;
        height: 150px;
        font-size: 60px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="one">1</div>
    <div class="two">2</div>
    <div class="three">3</div>
    <div class="four">4</div>
    <div class="five">5</div>
    <div class="six">6</div>
  </body>
</html>

<!--
interview = css positions(static, relative, absolute, sticky, fixed) difference of these
static - default position
relative - relatively moving the element from orginal position by giving top and left value
-->
