<html>
  <head>
    <title>Learn Transition</title>
    <style>
      .one {
        height: 400px;
        width: 400px;
        background-color: cadetblue;
        transition: width;
        transition-duration: 2s;
      }

      .one:hover {
        width: 600px;
      }
    </style>
  </head>
  <body>
    <div class="one"></div>
  </body>
</html>
