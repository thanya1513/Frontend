<html>
  <head>
    <title>Animation</title>
    <style>
      .one {
        height: 300px;
        width: 500px;
        background-color: bisque;
        font-size: 200px;
        text-align: center;
        animation-name: hello;
        animation-duration: 4s;
        position: relative;
      }

      /*     @keyframes hello {
        from {
          background-color: coral;
        }
        to {
          background-color: lightgreen;
        }
      } */

      @keyframes hello {
        0% {
          top: 0px;
          left: 0px;
        }
        25% {
          top: 0px;
          left: 200px;
        }
        50% {
          top: 200px;
          left: 200px;
        }
        75% {
          top: 200px;
          left: 0px;
        }
        100% {
          top: 0px;
          left: 0px;
        }
      }
    </style>
  </head>
  <body>
    <div class="one">1</div>
  </body>
</html>
