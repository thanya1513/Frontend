<html>
  <head>
    <title>Learn Flecx</title>
    <style>
      .one {
        background-color: lightcoral;
        height: 200px;
        width: 200px;
        font-size: 100px;
        border: 2px solid black;
        text-align: center;
      }

      .two {
        background-color: lightgreen;
        height: 200px;
        width: 200px;
        font-size: 100px;
        border: 2px solid black;
        text-align: center;
      }

      .three {
        background-color: lightskyblue;
        height: 200px;
        width: 200px;
        font-size: 100px;
        border: 2px solid black;
        text-align: center;
      }

      .main {
        height: 1000px;
        border: 2px solid black;
        display: flex;
        flex-direction: row; /*column, column-reverse, row-reverse */
        justify-content: space-around; /* space-between, space-evenly, space-around */
        align-items: start; /*center, end, start */
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="one">1</div>
      <div class="two">2</div>
      <div class="three">3</div>
    </div>
  </body>
</html>

<!--flex box theory: css approach to design a webpage in a one dimension-->
