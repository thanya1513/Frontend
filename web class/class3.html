<html>
  <head>
    <!--Change title of the page for each topic-->
    <title>My First Page</title>
    <meta name="description" content="My website on HTML" />
    <!--Used to optimize search engine(SEO) name="description is mandatory for search engine optimisation"-->
    <style>
      table,
      tr,
      td {
        border: 2px solid black;
      }
    </style>
  </head>

  <body>
    <!--Add Your Code Here-->
    <!--without using div tag-->
    <h1 style="color: blueviolet">Table Creation</h1>
    <h2 style="color: blueviolet">Table about sports</h2>

    <!--div act as a container, used to group multiple html elements-->
    <div style="color: blueviolet">
      <h1>Table Creation</h1>
      <h2>Table about sports</h2>
    </div>
    <table>
      <tr>
        <th>Name</th>
        <th>Sports</th>
        <th>Country</th>
      </tr>
      <tr>
        <td>Kholi</td>
        <td>Cricket</td>
        <td>India</td>
      </tr>
      <tr>
        <td>Ronaldo</td>
        <td>Football</td>
        <td>Portugal</td>
      </tr>
    </table>
  </body>
</html>
